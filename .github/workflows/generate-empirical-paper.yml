name: Generate CQS Empirical Paper

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First observation year
        required: true
        default: "2000"
      end_year:
        description: Last observation year
        required: true
        default: "2025"
  push:
    branches: [main]
    paths:
      - "scripts/generate_empirical_paper.py"
      - ".github/workflows/generate-empirical-paper.yml"

permissions:
  contents: write

concurrency:
  group: generate-cqs-paper
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pandas requests reportlab
      - name: Generate paper and data snapshot
        run: |
          python scripts/generate_empirical_paper.py \
            --start "${{ inputs.start_year || '2000' }}" \
            --end "${{ inputs.end_year || '2025' }}"
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "4. A Cross-Country Statistical and Econometric Analysis of Structural Relationships, Long-Run Dynamics, and Error Correction Using Cyclic Quotient Systems.pdf" data/processed/
          if ! git diff --cached --quiet; then
            git commit -m "Generate reproducible CQS empirical paper"
            git push
          else
            echo "Generated outputs are unchanged."
          fi
